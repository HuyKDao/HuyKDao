name: Update today section

"on":
  schedule:
    - cron: "30 6 * * *" # daily at 06:30 UTC, ~11:30pm Pacific: the day is (almost) done
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  today:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/today.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update today section [skip ci]" && git push)
